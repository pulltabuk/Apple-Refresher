[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Rebuild just after midnight UTC so day counters are right for the whole
# day (pages also refresh them live) and a finished countdown clears itself.
[functions."daily-build"]
  schedule = "5 0 * * *"

# Lets Netlify's Image CDN (/.netlify/images) resize photos stored in
# Supabase, so the phone upload page can show small thumbnails instead of
# downloading every full-size photo.
[images]
  remote_images = ["https://.*\\.supabase\\.co/storage/v1/object/public/.*"]

# X post cards: /c/<key>/<page> shows the saved card as the link preview,
# then forwards to <page>. The function claims /c/* itself (its
# config.path); see netlify/functions/card.mjs.

# Standard browser security headers on every page: no guessing file
# types, no framing this site inside someone else's page (clickjacking
# the admin), only the site's address (not the full page) sent to other
# sites, and no location or microphone access. YouTube embeds still work:
# they are frames inside this site, not this site inside a frame.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=()"
