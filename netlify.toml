[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Rebuild every morning so day counters stay accurate and a finished
# countdown clears itself. 06:10 UTC, a quiet time for the site.
[functions."daily-build"]
  schedule = "10 6 * * *"

# Lets Netlify's Image CDN (/.netlify/images) resize photos stored in
# Supabase, so the phone upload page can show small thumbnails instead of
# downloading every full-size photo.
[images]
  remote_images = ["https://.*\\.supabase\\.co/storage/v1/object/public/.*"]

# X post cards: /c/<key>/<page> shows the saved card as the link preview,
# then forwards to <page>. See netlify/functions/card.js.
[[redirects]]
  from = "/c/*"
  to = "/.netlify/functions/card/:splat"
  status = 200
  force = true
