[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Rebuild just after midnight UTC so day counters are right for the whole
# day (pages also refresh them live) and a finished countdown clears itself.
[functions."daily-build"]
  schedule = "5 0 * * *"

# The day's X post drafts, ready for review in the admin by the morning
# (06:00 UTC: 7am in summer, 6am in winter, UK time).
[functions."x-drafts-daily"]
  schedule = "0 6 * * *"

# Lets Netlify's Image CDN (/.netlify/images) resize photos stored in
# Supabase, so the phone upload page can show small thumbnails instead of
# downloading every full-size photo.
[images]
  remote_images = ["https://.*\\.supabase\\.co/storage/v1/object/public/.*"]

# X post cards: /c/<key>/<page> shows the saved card as the link preview,
# then forwards to <page>. The function claims /c/* itself (its
# config.path); see netlify/functions/card.mjs.

# Browser security headers are written to dist/_headers by build.js.
